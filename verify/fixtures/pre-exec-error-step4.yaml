apiVersion: x.dev/v1alpha1
kind: ExecutionPlan
metadata:
  name: pre-exec-error-step4
spec:
  steps:
    - id: s1
      tool: k8s.get_service
    - id: s2
      tool: k8s.get_pods
      dependsOn: [s1]
    - id: s3
