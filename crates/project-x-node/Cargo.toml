[package]
name = "project-x-node"
version = "0.1.0"
edition = "2021"
description = "Node.js native bindings for Project X"
license = "Apache-2.0"

[lib]
crate-type = ["cdylib"]

[dependencies]
project-x-core = { path = "../project-x-core" }
napi = { version = "2.16", default-features = false, features = ["napi4", "serde-json"] }
napi-derive = "2.16"
serde_json = "1.0"
serde_yaml = "0.9"

[build-dependencies]
napi-build = "2.1"
