[package]
name = "project-x-core"
version = "0.1.0"
edition = "2021"
description = "Core runtime and declarative execution protocol engine for Project X"
license = "Apache-2.0"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
sha2 = "0.10"
hex = "0.4"
thiserror = "2.0"
tokio = { version = "1.40", features = ["sync", "time", "rt", "macros"] }
async-trait = "0.1"
regex = "1.10"
chrono = { version = "0.4", features = ["serde", "clock"] }
uuid = { version = "1.10", features = ["v4", "serde"] }

[dev-dependencies]
tokio = { version = "1.40", features = ["full"] }
