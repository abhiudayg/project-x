[package]
name = "project-x-cli"
version = "0.1.0"
edition = "2021"
description = "CLI for Project X: Declarative Execution Protocol for AI Agents"
license = "Apache-2.0"

[[bin]]
name = "project-x"
path = "src/main.rs"

[dependencies]
project-x-core = { path = "../project-x-core" }
clap = { version = "4.5", features = ["derive"] }
tokio = { version = "1.40", features = ["full"] }
serde_json = "1.0"
serde_yaml = "0.9"
